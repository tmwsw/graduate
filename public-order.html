<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус заявки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/icon_32x32.png">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fas fa-clipboard-list me-2"></i>Статус заявки <span id="orderIdDisplay"></span></h4>
                    </div>
                    <div class="card-body" id="orderInfo">
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Загрузка...</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <small class="text-muted">Служба поддержки: support@remonttech.ru</small>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js" type="module"></script>
    <script type="module">
        import { fetchOrders, fetchClients, fetchDevices, fetchMasters } from './js/api.js';

        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        async function loadOrder() {
            if (!orderId) {
                document.getElementById('orderInfo').innerHTML = `
                    <div class="alert alert-danger">Номер заявки не указан</div>
                `;
                return;
            }
            document.getElementById('orderIdDisplay').textContent = `#${orderId}`;

            try {
                const [orders, clients, devices, masters] = await Promise.all([
                    fetchOrders(0, 1000),
                    fetchClients(0, 1000),
                    fetchDevices(0, 1000),
                    fetchMasters(0, 1000)
                ]);

                const order = orders.find(o => o.id === parseInt(orderId));
                if (!order) {
                    throw new Error('Заявка не найдена');
                }

                const client = clients.find(c => c.id === order.client_id);
                const device = devices.find(d => d.id === order.device_id);
                const master = masters.find(m => m.id === order.master_id);

                const statusMap = {
                    'new': { text: 'Новая', class: 'bg-secondary' },
                    'in_repair': { text: 'В ремонте', class: 'bg-warning' },
                    'ready': { text: 'Готова', class: 'bg-success' },
                    'returned': { text: 'Выдана', class: 'bg-info' }
                };
                const status = statusMap[order.status] || { text: order.status, class: 'bg-light' };

                document.getElementById('orderInfo').innerHTML = `
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <h5>Клиент</h5>
                            <p><strong>${client?.full_name || '—'}</strong><br>
                            ${client?.phone || ''}<br>
                            ${client?.email || ''}</p>
                        </div>
                        <div class="col-md-6">
                            <h5>Устройство</h5>
                            <p><strong>${device ? device.brand + ' ' + device.model : '—'}</strong><br>
                            ${device?.device_type || ''}<br>
                            Серийный номер: ${device?.serial_number || '—'}</p>
                        </div>
                    </div>
                    <hr>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <h5>Описание проблемы</h5>
                            <p>${order.description || '—'}</p>
                        </div>
                        <div class="col-md-6">
                            <h5>Статус</h5>
                            <span class="badge ${status.class} fs-6">${status.text}</span>
                            <p class="mt-2">Создана: ${order.created_at ? new Date(order.created_at).toLocaleString('ru-RU') : '—'}</p>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-md-6">
                            <h5>Мастер</h5>
                            <p>${master?.full_name || 'Не назначен'}</p>
                        </div>
                        <div class="col-md-6">
                            <h5>Стоимость</h5>
                            <p><strong>${order.price ? order.price.toLocaleString() + ' ₽' : 'Не определена'}</strong></p>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error(error);
                document.getElementById('orderInfo').innerHTML = `
                    <div class="alert alert-danger">Ошибка загрузки: ${error.message}</div>
                `;
            }
        }

        loadOrder();
    </script>
</body>
</html>
